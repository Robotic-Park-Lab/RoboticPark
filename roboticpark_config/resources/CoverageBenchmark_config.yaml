# Default Robotic Park Coverage Formation Control Benchmark

Operation:
  mode: virtual     # physical, virtual, hybrid
  tool: Webots              # Gazebo, Webots
  world: CoverageBenchmark.wbt 

Experience:
  type: formation           # identification, formation, navigation

Architecture: 
  mode: distributed   # centralized, distributed_ros2, distributed
  node: 
    executable: centralized_formation_controller
    name: formation_controller
    pkg: uned_swarm_task

CPU_Monitoring: 
  enable: True
  node: 
    executable: measure_process
    name: benchmark
    pkg: measure_process_ros2_pkg
  processes: webots-bin, driver, ros2, swarm_driver, rviz2

Interface: 
  enable: True
  rviz2: 
    enable: True
    node: 
      executable: rviz2
      name: rviz2
      pkg: rviz2
    file: CoverageBenchmark.rviz
  rqt: 
    enable: False
    node: 
      executable: rqt_gui
      name: interface
      pkg: rqt_gui
    file: 
  own: 
    enable: False
    node:
      name:
      pkg:
    file:

Data_Logging: 
  enable: False
  all: True
  name: date
  topics: /ros2_cpu /cpu_stats /dron01/local_pose /dron01/global_error /dron02/local_pose /dron02/global_error /dron03/local_pose /dron03/global_error /dron04/local_pose /dron04/global_error /dron05/local_pose /dron05/global_error /dron06/local_pose /dron06/global_error /dron07/local_pose /dron07/global_error /dron08/local_pose /dron08/global_error /dron09/local_pose /dron09/global_error /dron10/local_pose /dron10/global_error /dron11/local_pose /dron11/global_error /dron12/local_pose /dron12/global_error /dron13/local_pose /dron13/global_error /dron14/local_pose /dron14/global_error /dron15/local_pose /dron15/global_error /dron16/local_pose /dron16/global_error /dron17/local_pose /dron17/global_error /dron18/local_pose /dron18/global_error /dron19/local_pose /dron19/global_error /dron20/local_pose /dron20/global_error /dron21/local_pose /dron21/global_error /dron22/local_pose /dron22/global_error /dron23/local_pose /dron23/global_error /dron24/local_pose /dron24/global_error /dron25/local_pose /dron25/global_error /dron26/local_pose /dron26/global_error /dron27/local_pose /dron27/global_error /dron28/local_pose /dron28/global_error /dron29/local_pose /dron29/global_error /dron30/local_pose /dron30/global_error /dron31/local_pose /dron31/global_error /dron32/local_pose /dron32/global_error /dron33/local_pose /dron33/global_error /dron34/local_pose /dron34/global_error /dron35/local_pose /dron35/global_error /dron36/local_pose /dron36/global_error /dron37/local_pose /dron37/global_error /dron38/local_pose /dron38/global_error /dron39/local_pose /dron39/global_error /dron40/local_pose /dron40/global_error /dron41/local_pose /dron41/global_error /dron42/local_pose /dron42/global_error /dron43/local_pose /dron43/global_error /dron44/local_pose /dron44/global_error /dron45/local_pose /dron45/global_error /dron46/local_pose /dron46/global_error /dron47/local_pose /dron47/global_error /dron48/local_pose /dron48/global_error /dron49/local_pose /dron49/global_error /dron50/l